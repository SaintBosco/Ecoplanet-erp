<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecoplanet Management ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--header-h:48px;--sidebar-w:224px;--sidebar-collapsed:64px;--blue:#00d4ff;--gray900:#f0f4f8;--gray800:#d0d8e4;--gray700:#b0bac8;--gray600:#9098a8;--gray500:#707a88;--gray400:#5a6474;--gray300:#3a4455;--gray200:#252d3a;--gray100:#1a2130;--gray50:#131829;--white:#e8eef4;--green:#4ade80;--red:#f87171;--amber:#fbbf24;--purple:#a855f7;--teal:#2dd4bf;--cyan:#4ade80;--neon:#22c55e;--radius:0;--eco-primary:#22c55e;--eco-secondary:#16a34a;--eco-dark:#15803d;--eco-accent:#86efac;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--gray100);min-height:100vh;color:var(--gray900);font-size:14px;line-height:1.5}
/* HEADER */
.header{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:#0a1a0f;display:flex;align-items:center;z-index:100;color:var(--white);border-bottom:1px solid #1a3a22}
.header-logo{display:flex;align-items:center;gap:8px;padding:0 12px;height:100%;border-right:1px solid #1a2540;text-decoration:none;color:var(--white)}
.header-logo span:first-child{font-weight:300;font-size:15px;color:var(--white)}
.header-logo span:last-child{color:#78A9FF;margin-left:4px;font-weight:300;font-size:15px}
.header-search{flex:1;display:flex;justify-content:center;padding:0 16px;max-width:600px;margin:0 auto}
.header-search input{width:100%;height:32px;background:#111828;color:#e0e6ed;border:1px solid #1a2540;padding:0 12px 0 36px;font-size:13px;font-family:inherit;outline:none}
.header-search input:focus{border-color:var(--cyan);background:#1a2540}
.header-search{position:relative}
.header-search svg{position:absolute;left:24px;top:50%;transform:translateY(-50%);color:#6b7280}
.header-actions{display:flex;align-items:center;gap:0;flex-shrink:0}
.header-btn{height:var(--header-h);padding:0 12px;display:flex;align-items:center;gap:6px;background:none;border:none;color:#b0bcc8;cursor:pointer;font-family:inherit;font-size:13px;transition:background .15s,color .15s}
.header-btn:hover{background:#1a2540;color:var(--cyan)}
.header-btn svg{width:18px;height:18px}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;color:#000;font-size:12px;font-weight:500}
/* SIDEBAR */
.sidebar{position:fixed;top:var(--header-h);left:0;bottom:0;width:var(--sidebar-w);background:#0d1a12;border-right:1px solid #1a3a22;display:flex;flex-direction:column;z-index:90;transition:width .2s;overflow:hidden}
.sidebar.collapsed{width:var(--sidebar-collapsed)}
.sidebar-toggle{height:48px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #1a2540;cursor:pointer;color:var(--gray500);flex-shrink:0;transition:background .15s}
.sidebar-toggle:hover{background:#111828;color:var(--cyan)}
.sidebar-toggle svg{transition:transform .2s}
.sidebar.collapsed .sidebar-toggle svg{transform:rotate(180deg)}
.sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0}
.sidebar-nav::-webkit-scrollbar{display:none}
.nav-link{display:flex;align-items:center;height:48px;padding:0 20px;color:#b0bcc8;text-decoration:none;cursor:pointer;transition:background .15s,color .15s;position:relative;white-space:nowrap;gap:12px;border:none;background:none;width:100%;font-family:inherit;font-size:14px}
.nav-link:hover{background:#0f2015;color:#f0f4f8}
.nav-link.active{background:#0f2015;color:var(--green)}
.nav-link.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.nav-link svg{width:20px;height:20px;flex-shrink:0}
.nav-link .nav-label{margin-left:12px;font-weight:500;font-size:13px}
.nav-group-header{font-size:10px;font-weight:700;color:#7080a0;letter-spacing:1.2px;text-transform:uppercase;padding:16px 20px 6px;user-select:none;white-space:nowrap}
.sidebar.collapsed .nav-group-header{font-size:0;padding:0;height:0;overflow:hidden}
.sidebar.collapsed .nav-label{display:none}
.sidebar.collapsed .nav-link{justify-content:center;padding:0}
.nav-tooltip{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);background:#080c18;color:var(--cyan);padding:4px 8px;border-radius:4px;font-size:12px;white-space:nowrap;opacity:0;visibility:hidden;transition:all .2s;pointer-events:none;z-index:200}
.sidebar.collapsed .nav-link:hover .nav-tooltip{opacity:1;visibility:visible}
/* MAIN */
.main{margin-left:var(--sidebar-w);margin-top:var(--header-h);min-height:calc(100vh - var(--header-h));padding:24px;transition:margin-left .2s}
.sidebar.collapsed ~ .main{margin-left:var(--sidebar-collapsed)}
/* TABS */
.tab-page{display:none}
.tab-page.active{display:block}
/* CARDS */
.card{background:#111828;border:1px solid #1a2540;border-radius:var(--radius);overflow:hidden}
.card-header{padding:16px 20px;border-bottom:1px solid #1a2540;display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:15px;font-weight:500;color:#f0f4f8}
.card-body{padding:20px}
/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#111828;border:1px solid #1a2540;border-radius:var(--radius);padding:20px}
.stat-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat-icon svg{width:20px;height:20px}
.stat-icon.blue{background:rgba(0,212,255,.15);color:var(--cyan)}
.stat-icon.green{background:rgba(0,255,136,.15);color:var(--green)}
.stat-icon.orange{background:rgba(255,176,32,.15);color:var(--amber)}
.stat-icon.purple{background:rgba(168,85,247,.15);color:var(--purple)}
.stat-icon.red{background:rgba(255,64,96,.15);color:var(--red)}
.stat-icon.teal{background:rgba(0,204,170,.15);color:var(--teal)}
.stat-value{font-size:24px;font-weight:300;color:#f0f4f8;margin-bottom:4px}
.stat-label{font-size:13px;color:#90a0b8}
/* TABLE */
.table-wrap{overflow-x:auto;max-height:600px;overflow-y:auto}
table{width:100%;border-collapse:collapse}
th{padding:10px 16px;text-align:left;font-weight:600;color:#c0cce0;font-size:12px;text-transform:uppercase;letter-spacing:.5px;background:#0d1220;border-bottom:1px solid #1a2540;position:sticky;top:0;z-index:1}
td{padding:10px 16px;border-bottom:1px solid #1a2540;font-size:13px;color:#c0cce0}
tr:hover td{background:#111828}
/* BADGES */
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-success{background:rgba(0,255,136,.15);color:#00ff88}
.badge-warning{background:rgba(255,176,32,.15);color:#ffb020}
.badge-info{background:rgba(0,212,255,.15);color:#00d4ff}
.badge-danger{background:rgba(255,64,96,.15);color:#ff4060}
.badge-gray{background:#1a2130;color:#90a0b8}
.badge-purple{background:rgba(168,85,247,.15);color:#a855f7}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid transparent;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--cyan);color:#000;border-color:var(--cyan)}
.btn-primary:hover{background:#00b8e0}
.btn-secondary{background:#111828;color:#c0cce0;border-color:#1a2540}
.btn-secondary:hover{background:#1a2540;color:#f0f4f8}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#e03050}
.btn-ghost{background:transparent;color:#90a0b8;border-color:transparent}
.btn-ghost:hover{background:#111828;color:#f0f4f8}
.btn-sm{padding:4px 10px;font-size:12px}
.btn svg{width:16px;height:16px}
/* FORMS */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:500;color:#c0cce0;margin-bottom:6px}
.form-input{width:100%;padding:8px 12px;border:1px solid #1a2540;border-radius:var(--radius);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;background:#0d1220;color:#f0f4f8}
.form-input:focus{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
select.form-input{appearance:auto}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
textarea.form-input{resize:vertical;min-height:60px}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;visibility:hidden;transition:all .2s}
.modal-overlay.open{opacity:1;visibility:visible}
.modal-box{background:#111828;border:1px solid #1a2540;border-radius:var(--radius);padding:24px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);transform:translateY(8px);transition:transform .2s}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:16px;font-weight:600;color:#f0f4f8}
.modal-close{background:none;border:none;cursor:pointer;padding:8px;color:#90a0b8;border-radius:4px;font-size:20px;line-height:1}
.modal-close:hover{background:#1a2540;color:#f0f4f8}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid #1a2540}
/* HERO */
.hero{background:linear-gradient(135deg,#0a1628,#0d2847,#0a1e3a);border-radius:var(--radius);padding:32px;color:var(--white);margin-bottom:24px;position:relative;overflow:hidden;border:1px solid #1a3550}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:rgba(255,255,255,.05);transform:rotate(45deg)}
.hero-greeting{font-size:24px;font-weight:300;margin-bottom:8px}
.hero-sub{font-size:14px;opacity:.9;margin-bottom:16px}
.hero-quote{border-left:2px solid rgba(255,255,255,.4);padding-left:16px;font-style:italic;font-size:13px;opacity:.8}
.hero-quote cite{display:block;font-style:normal;margin-top:4px;font-size:12px;opacity:.7}
/* QUICK ACCESS */
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.quick-tile{background:#111828;border:1px solid #1a2540;border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .15s}
.quick-tile:hover{border-color:var(--cyan);box-shadow:0 2px 12px rgba(0,212,255,.15)}
.quick-tile-title{font-size:13px;font-weight:500;color:#f0f4f8;margin-bottom:4px}
.quick-tile-desc{font-size:12px;color:#90a0b8}
/* SECTION */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.section-title{font-size:16px;font-weight:500;color:#f0f4f8}
.section-actions{display:flex;gap:8px}
/* TOAST */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);color:var(--white);font-weight:500;font-size:13px;animation:slideIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.info{background:var(--cyan)}
@keyframes slideIn{from{opacity:0;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(100%)}}
/* TABS MODULE */
.mod-tabs{display:flex;border-bottom:1px solid #1a2540;margin-bottom:16px;gap:0}
.mod-tab{padding:10px 16px;cursor:pointer;font-size:13px;font-weight:500;color:#90a0b8;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.mod-tab:hover{color:#d0d8e4}
.mod-tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.mod-tab-content{display:none}
.mod-tab-content.active{display:block}
/* PROGRESS BAR */
.progress{background:#1a2540;border-radius:4px;height:6px;overflow:hidden}
.progress-bar{height:100%;border-radius:4px;transition:width .3s}
.progress-bar.green{background:var(--green)}
.progress-bar.blue{background:var(--cyan)}
.progress-bar.amber{background:var(--amber)}
.progress-bar.red{background:var(--red)}
/* SEARCH */
.search-box{position:relative;margin-bottom:16px}
.search-box input{width:100%;padding:8px 12px 8px 36px;border:1px solid #1a2540;border-radius:var(--radius);font-size:13px;font-family:inherit;outline:none;background:#0d1220;color:#e0e6ed}
.search-box input:focus{border-color:var(--cyan)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray400);width:16px;height:16px}
/* FILTER BAR */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{padding:6px 10px;border:1px solid #1a2540;border-radius:var(--radius);font-size:13px;font-family:inherit;background:#0d1220;color:#e0e6ed}
/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:var(--sidebar-w)!important}
  .sidebar.mobile-open{transform:translateX(0)}
  .main{margin-left:0!important;padding:16px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .header-search{display:none}
}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr}}
/* USER DROPDOWN */
.user-dropdown{position:absolute;right:0;top:calc(var(--header-h) + 4px);width:220px;background:#080c18;border:1px solid #1a2540;border-radius:8px;box-shadow:0 16px 48px rgba(0,0,0,.6);z-index:300;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;overflow:hidden}
.user-dropdown.open{opacity:1;visibility:visible;transform:translateY(0)}
.user-dropdown-header{display:flex;align-items:center;gap:10px;padding:16px}
.user-dropdown-divider{height:1px;background:#1a2540;margin:4px 0}
.user-dropdown-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;background:none;border:none;color:#c0cce0;cursor:pointer;font-size:13px;font-family:inherit;transition:background .15s,color .15s;text-align:left}
.user-dropdown-item:hover{background:#111828;color:var(--cyan)}
.user-dropdown-item svg{width:16px;height:16px;flex-shrink:0}
/* NOTIFICATIONS PANEL */
.notifications-panel{position:absolute;right:0;top:calc(var(--header-h) + 4px);width:400px;background:#111828;border:1px solid #1a2540;border-radius:var(--radius);box-shadow:0 16px 48px rgba(0,0,0,.5);z-index:300;opacity:0;visibility:hidden;transform:translateY(-8px);transition:all .2s;max-height:500px;overflow:hidden;display:flex;flex-direction:column}
.notifications-panel.open{opacity:1;visibility:visible;transform:translateY(0)}
.notifications-header{padding:16px;border-bottom:1px solid #1a2540;display:flex;justify-content:space-between;align-items:center}
.notifications-header h3{font-size:15px;font-weight:500;color:#e0e6ed}
.notifications-tabs{display:flex;border-bottom:1px solid #1a2540;padding:0 16px}
.notifications-tab{padding:8px 12px;font-size:12px;font-weight:500;color:#90a0b8;cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;transition:all .15s}
.notifications-tab:hover{color:#d0d8e4}
.notifications-tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.notifications-list{flex:1;overflow-y:auto;max-height:380px}
.notifications-item{padding:12px 16px;border-bottom:1px solid #1a2540;display:flex;gap:10px;cursor:pointer;transition:background .15s}
.notifications-item:hover{background:#111828}
.notifications-item.unread{background:rgba(0,212,255,.05)}
.notifications-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.notifications-content{flex:1;min-width:0}
.notifications-content .title{font-size:13px;font-weight:500;color:#e0e6ed;margin-bottom:2px}
.notifications-content .desc{font-size:12px;color:#90a0b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notifications-content .time{font-size:11px;color:#7080a0;margin-top:2px}
.notifications-empty{padding:40px;text-align:center;color:#7080a0;font-size:13px}
/* DARK MODE */
body.dark{--gray50:#111827;--gray100:#1f2937;--gray200:#374151;--gray300:#4b5563;--gray400:#6b7280;--gray500:#9ca3af;--gray600:#d1d5db;--gray700:#e5e7eb;--gray800:#f3f4f6;--gray900:#f9fafb;--white:#1f2937;background:#0d1120}
body.dark .header{background:#060a14}
body.dark .sidebar{background:#0a0f1e;border-color:#1a2540}
body.dark .card{background:#111828;border-color:#1a2540}
body.dark .stat-card{background:#111828;border-color:#1a2540}
body.dark th{background:#0d1220}
body.dark .form-input{background:#0d1220;border-color:#1a2540;color:#e0e6ed}
body.dark .modal-box{background:#111828}
body.dark .hero{background:linear-gradient(135deg,#060a14,#0d2040)}
body.dark .search-box input{background:#0d1220;color:#e0e6ed}
body.dark .notifications-panel{background:#111828;border-color:#1a2540}
body.dark .notifications-item:hover{background:#1a2540}
body.dark .user-dropdown-item:hover{background:#1a2540}
body.dark .nav-link:hover{background:#111828}
body.dark .nav-link.active{background:#111828}
body.dark .quick-tile{background:#111828;border-color:#1a2540}
body.dark .badge-gray{background:#1a2130;color:#90a0b8}
body.dark .filter-bar select,body.dark .filter-bar input{background:#0d1220;color:#e0e6ed}
body.dark .mod-tab-content.active{color:#e0e6ed}
body.dark .modal-close{color:#90a0b8}
body.dark .modal-close:hover{background:#1a2540}
/* DMS STYLES */
.dms-dropzone{border:2px dashed #1a2540;border-radius:8px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;background:#0d1220}
.dms-dropzone:hover,.dms-dropzone.dragover{border-color:var(--cyan);background:rgba(0,212,255,.05)}
.dms-dropzone.dragover{transform:scale(1.01);box-shadow:0 0 30px rgba(0,212,255,.1)}
.dms-dropzone-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:rgba(0,212,255,.1);display:flex;align-items:center;justify-content:center}
.dms-stamp-overlay{position:absolute;top:8px;right:8px;padding:4px 10px;font-size:11px;font-weight:700;border:2px solid;border-radius:4px;transform:rotate(-5deg);letter-spacing:1px;pointer-events:none;z-index:5}
.dms-stamp-overlay.APPROVED{color:#00ff88;border-color:#00ff88;background:rgba(0,255,136,.1)}
.dms-stamp-overlay.REJECTED{color:#ff4060;border-color:#ff4060;background:rgba(255,64,96,.1)}
.dms-stamp-overlay.DRAFT{color:#ffb020;border-color:#ffb020;background:rgba(255,176,32,.1)}
.dms-stamp-overlay.PAID{color:#00ff88;border-color:#00ff88;background:rgba(0,255,136,.1)}
.dms-stamp-overlay.CONFIDENTIAL{color:#ec4899;border-color:#ec4899;background:rgba(236,72,153,.1)}
.dms-stamp-overlay.CANCELLED{color:#ff4060;border-color:#ff4060;background:rgba(255,64,96,.1);text-decoration:line-through}
.dms-stamp-overlay.COPY{color:#6b7280;border-color:#6b7280;background:rgba(107,114,128,.1)}
.dms-stamp-overlay.ORIGINAL{color:#00d4ff;border-color:#00d4ff;background:rgba(0,212,255,.1)}
.dms-wf-progress{display:flex;align-items:center;gap:0;margin:16px 0}
.dms-wf-step{flex:1;text-align:center;position:relative;padding:8px 4px}
.dms-wf-step::before{content:'';position:absolute;top:50%;left:0;right:0;height:2px;background:#1a2540;z-index:0}
.dms-wf-step:first-child::before{left:50%}
.dms-wf-step:last-child::before{right:50%}
.dms-wf-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 4px;position:relative;z-index:1;font-size:12px;font-weight:600}
.dms-wf-dot.pending{background:#1a2540;color:#90a0b8;border:2px solid #1a2540}
.dms-wf-dot.active{background:var(--cyan);color:#000;border:2px solid var(--cyan);animation:pulse 2s infinite}
.dms-wf-dot.done{background:var(--green);color:#000;border:2px solid var(--green)}
.dms-wf-dot.rejected{background:var(--red);color:#fff;border:2px solid var(--red)}
.dms-wf-label{font-size:10px;color:#90a0b8;max-width:80px;margin:0 auto}
.dms-wf-step.active .dms-wf-label{color:var(--cyan)}
.dms-wf-step.done .dms-wf-label{color:var(--green)}

  if(token)h['Authorization']='Bearer '+token;

tn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Create Customer</button></div></form>`;
}
async function submitCustomer(e,callback){
  e.preventDefault();const fd=new FormData(e.target);const obj={};fd.forEach((v,k)=>obj[k]=v);
  if(obj.creditLimit)obj.creditLimit=parseFloat(obj.creditLimit);
  obj.status='active';
  const r=await api('/customers',{method:'POST',body:JSON.stringify(obj)});
  if(r&&!r.error){
    await loadTable('customers');
    if(callback){
      closeModal();
      const sel=document.getElementById('invoiceCustSelect')||document.getElementById('soCustSelect')||document.getElementById('qtCustSelect');
      if(sel){
        const opt=document.createElement('option');opt.value=r.id;opt.textContent=r.name;opt.selected=true;
        sel.appendChild(opt);
      }
      showToast('Customer created & selected');
    }else{
      closeModal();showToast('Customer created');settingsTab='crm';renderCRM();
    }
  }else{showToast(r.error||'Failed to create customer','error')}
}

function saveMfgSettings(e){
  if(e)e.preventDefault();
  const form=document.querySelector('#mfgTabContent form');
  if(!form)return;
  const fd=new FormData(form);const obj={};
  fd.forEach((v,k)=>{obj[k]=v});
  obj.isActive=form.querySelector('[name=isActive]').checked;
  if(obj.defaultLeadTime)obj.defaultLeadTime=parseInt(obj.defaultLeadTime);
  if(obj.defaultScrapRate)obj.defaultScrapRate=parseFloat(obj.defaultScrapRate);
  api('/manufacturing/settings',{method:'PUT',body:JSON.stringify(obj)}).then(()=>{showToast('Manufacturing settings saved');mfgTab='orders';renderManufacturing()});
}

let _jeLineCount = 2;
function addJELine() {
  const acctOpts = (DB.accounts||[]).map(a=>`<option value="${a.id}">${a.code} - ${a.name}</option>`).join('');
  const i = _jeLineCount++;
  const div = document.createElement('div');
  div.className = 'form-row'; div.style.cssText = 'gap:8px;margin-bottom:8px';
  div.innerHTML = `<select class="form-input" name="accountId_${i}" style="flex:3">${acctOpts}</select><input class="form-input" name="description_${i}" placeholder="Description" style="flex:2"><input type="number" class="form-input" name="debit_${i}" placeholder="Debit" step="0.01" style="flex:1"><input type="number" class="form-input" name="credit_${i}" placeholder="Credit" step="0.01" style="flex:1">`;
  document.getElementById('jeLines').appendChild(div);
}
async function submitJournalEntry(e) {
  e.preventDefault(); const fd = new FormData(e.target);
  const lines = [];
  for (let i = 0; i < _jeLineCount; i++) {
    const acctId = fd.get(`accountId_${i}`);
    const desc = fd.get(`description_${i}`);
    const debit = parseFloat(fd.get(`debit_${i}`)) || 0;
    const credit = parseFloat(fd.get(`credit_${i}`)) || 0;
    if (acctId && (debit > 0 || credit > 0)) lines.push({ accountId: acctId, description: desc, debit, credit });
  }
  _jeLineCount = 2;
  const r = await api('/accounting/journal-entries', { method: 'POST', body: JSON.stringify({ date: fd.get('date'), description: fd.get('description'), reference: fd.get('reference'), period: fd.get('period'), lines }) });
  if (r && r.error) { showToast(r.error, 'error'); return; }
  closeModal(); showToast('Journal entry created'); renderAccounting();
}
async function approveJE(id) { await api('/accounting/journal-entries/' + id + '/approve', { method: 'PUT' }); showToast('Journal entry posted'); renderAccounting(); }
async function rejectJE(id) { await api('/accounting/journal-entries/' + id + '/reject', { method: 'PUT' }); showToast('Journal entry rejected'); renderAccounting(); }
async function deleteJE(id) { if (!confirm('Delete this draft entry?')) return; await api('/accounting/journal-entries/' + id, { method: 'DELETE' }); showToast('Deleted'); renderAccounting(); }

async function loadIFRSDisclosures() {
  const [disc, nat, mpm, xbrl] = await Promise.all([
    api('/accounting/ifrs/disclosures'),
    api('/accounting/ifrs/expenses-by-nature'),
    api('/accounting/ifrs/mpm'),
    api('/accounting/ifrs/xbrl-export')
  ]);
  const el = document.getElementById('ifrsDisclosureContent');
  if (!el) return;
  const tl = (l, v, b) => `<div style="display:flex;justify-content:space-between;padding:${b?'6':'3'}px 0;border-top:${b?'2':'1'}px solid var(--border-color);font-weight:${b?'700':'400'};font-size:${b?'13':'11'}px"><span>${l}</span><span style="color:${v>=0?'var(--green)':'var(--red)'}">${money(v)}</span></div>`;
  el.innerHTML = `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div>
      <div style="font-weight:600;margin-bottom:6px;color:var(--cyan)">Significant Accounting Policies (IAS 1.117)</div>
      ${Object.entries(disc?.significantAccountingPolicies||{}).map(([k,v])=>`<div style="padding:3px 0;font-size:11px"><span style="font-weight:500;color:var(--amber)">${k.replace(/([A-Z])/g,' $1').trim()}:</span> <span style="color:var(--gray400)">${v}</span></div>`).join('')}
      <div style="font-weight:600;margin:10px 0 6px;color:var(--amber)">Related Party Disclosures (IAS 1.122-125)</div>
      ${(disc?.relatedPartyDisclosures||[]).map(p=>`<div style="padding:2px 0;font-size:11px"><span style="font-weight:500">${p.name}</span> - ${p.relationship}: ${p.transactions}</div>`).join('')}
      <div style="font-weight:600;margin:10px 0 6px;color:var(--purple)">Financial Instruments Risk (IFRS 7)</div>
      ${Object.entries(disc?.financialInstrumentsRisk||{}).map(([k,v])=>`<div style="padding:2px 0;font-size:11px"><span style="font-weight:500;color:var(--cyan)">${k.replace(/([A-Z])/g,' $1').trim()}:</span> <span style="color:var(--gray400)">${v}</span></div>`).join('')}
    </div>
    <div>
      <div style="font-weight:600;margin-bottom:6px;color:var(--cyan)">Specified Expenses by Nature (IFRS 18.97)</div>
      ${(nat?.expensesByNature||[]).map(n=>`<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:11px"><span style="padding-left:8px">${n.label}</span><span>${money(n.amount)}</span></div>`).join('')}
      ${tl('Total Expenses by Nature', nat?.totalExpensesByNature, true)}
      <div style="font-weight:600;margin:10px 0 6px;color:var(--amber)">Management Performance Measures (IFRS 18.139)</div>
      ${(mpm?.mpm||[]).map(m=>`<div style="padding:3px 0;font-size:11px"><div style="display:flex;justify-content:space-between"><span style="font-weight:500">${m.name}</span><span style="color:${m.value>=0?'var(--green)':'var(--red)'}">${money(m.value)}</span></div><div style="color:var(--gray500);font-size:10px">${m.description}</div></div>`).join('')}
      <div style="font-weight:600;margin:10px 0 6px;color:var(--green)">XBRL Export <button class="btn btn-sm" onclick="downloadXBRL()" style="font-size:10px;padding:2px 8px">Download</button></div>
      <div style="padding:4px;background:rgba(0,212,255,0.1);border-radius:6px;font-size:11px">Facts: ${xbrl?.factCount||0} | Namespace: ${xbrl?.namespace||''} | Standard: ${xbrl?.standard||''}</div>
    </div>
  </div>`;
}

function downloadXBRL() {
  api('/accounting/ifrs/xbrl-export').then(data => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ifrs-xbrl-export.json';
    a.click();
    URL.revokeObjectURL(url);
  });
}

async function autoMatchReconciliation(){
  const bankAccountId=document.getElementById('reconBankAcct')?.value;
  const statementDate=document.querySelector('#reconDate_wrap input[type=hidden]')?.value;
  const statementBalance=parseFloat(document.getElementById('reconBalance')?.value);
  if(!bankAccountId){showToast('Select a bank account');return;}
  try{
    const r=await api('/banking/reconciliation/auto-match',{method:'POST',body:JSON.stringify({bankAccountId,statementDate,statementBalance})});
    showToast(`Matched ${r.matched} transactions (${r.unmatchedCheques} cheques, ${r.unmatchedPayments} payments unmatched)`);
    renderAccounting();
  }catch(e){showToast('Auto-match failed: '+e.message);}
}

function openGSTReturnModal(){
  openModal(`<div class="modal-header"><h3 class="modal-title">New GST Return</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form onsubmit="submitGSTReturn(event)"><div class="form-row"><div class="form-group"><label class="form-label">Period *</label><input class="form-input" name="period" placeholder="e.g. 2026-Q3" required></div><div class="form-group"><label class="form-label">Status</label><select class="form-input" name="status"><option value="draft">Draft</option><option value="pending">Pending</option></select></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Start Date *</label>${calDate('startDate','','Start Date')}</div><div class="form-group"><label class="form-label">End Date *</label>${calDate('endDate','','End Date')}</div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Total Sales (ZAR) *</label><input type="number" class="form-input" name="totalSales" step="100" required></div><div class="form-group"><label class="form-label">Total Purchases (ZAR) *</label><input type="number" class="form-input" name="totalPurchases" step="100" required></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Output Tax (ZAR) *</label><input type="number" class="form-input" name="outputTax" step="100" required></div><div class="form-group"><label class="form-label">Input Tax (ZAR) *</label><input type="number" class="form-input" name="inputTax" step="100" required></div></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Create Return</button></div></form>`);
}
async function submitGSTReturn(e){
  e.preventDefault();const fd=new FormData(e.target);
  const outputTax=parseFloat(fd.get('outputTax'));const inputTax=parseFloat(fd.get('inputTax'));
  await api('/tax/gst-returns',{method:'POST',body:JSON.stringify({period:fd.get('period'),startDate:fd.get('startDate'),endDate:fd.get('endDate'),totalSales:parseFloat(fd.get('totalSales')),totalPurchases:parseFloat(fd.get('totalPurchases')),outputTax,inputTax,netTax:outputTax-inputTax,status:fd.get('status')})});
  closeModal();showToast('GST return created');renderAccounting();
}
function openSettlementModal(){
  openModal(`<div class="modal-header"><h3 class="modal-title">Statutory Settlement</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form onsubmit="submitSettlement(event)"><div class="form-row"><div class="form-group"><label class="form-label">Type *</label><select class="form-input" name="type" required><option value="paye">PAYE</option><option value="uif">UIF</option><option value="vat">VAT</option><option value="income_tax">Income Tax</option></select></div><div class="form-group"><label class="form-label">Amount (ZAR) *</label><input type="number" class="form-input" name="amount" step="0.01" required></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Settlement Date</label>${calDate('date','','Date')}</div><div class="form-group"><label class="form-label">Reference</label><input class="form-input" name="reference" placeholder="e.g. SARS payment ref"></div></div>
    <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Settle</button></div></form>`);
}
async function submitSettlement(e){
  e.preventDefault();const fd=new FormData(e.target);
  await api('/accounting/statutory/settle',{method:'POST',body:JSON.stringify({type:fd.get('type'),amount:parseFloat(fd.get('amount')),date:fd.get('date'),reference:fd.get('reference')})});
  closeModal();showToast('Settlement recorded');renderAccounting();

// ====== BVA REPORT MODULE ======
let bvaTab='overview';let bvaYear=2026;let bvaCharts={};
const MONTHS_BVA=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtBVA=v=>v===null||v===undefined?'-':v<0?'-R'+Math.abs(v).toLocaleString('en-ZA',{maximumFractionDigits:0}):'R'+v.toLocaleString('en-ZA',{maximumFractionDigits:0});
const fmtBVAS=v=>v===null?'-':v<0?'-R'+Math.abs(v).toLocaleString('en-ZA',{maximumFractionDigits:0}):'+R'+v.toLocaleString('en-ZA',{maximumFractionDigits:0});
const bvaPct=(a,b)=>b===0?0:((a-b)/Math.abs(b)*100);
function destroyBVAChart(id){if(bvaCharts[id]){bvaCharts[id].destroy();delete bvaCharts[id]}}
const renderBVA=async()=>{
  const page=$('content');if(!page)return;
  page.innerHTML=`<div class="card" style="margin-bottom:24px"><div class="mod-tabs" style="padding:0 20px">
    <button class="mod-tab${bvaTab==='overview'?' active':''}" onclick="bvaTab='overview';renderBVA()">Overview</button>
    <button class="mod-tab${bvaTab==='budget'?' active':''}" onclick="bvaTab='budget';renderBVA()">Budget vs Actual</button>
    <button class="mod-tab${bvaTab==='cashflow'?' active':''}" onclick="bvaTab='cashflow';renderBVA()">Cash Flow</button>
    <button class="mod-tab${bvaTab==='workforce'?' active':''}" onclick="bvaTab='workforce';renderBVA()">Workforce</button>
    <button class="mod-tab${bvaTab==='field'?' active':''}" onclick="bvaTab='field';renderBVA()">Field Ops</button>
    <button class="mod-tab${bvaTab==='scenario'?' active':''}" onclick="bvaTab='scenario';renderBVA()">Scenario</button>
    <button class="mod-tab${bvaTab==='forecast'?' active':''}" onclick="bvaTab='forecast';renderBVA()">Forecast</button>
    <button class="mod-tab${bvaTab==='alerts'?' active':''}" onclick="bvaTab='alerts';renderBVA()">Alerts ${(DB.bva_alerts||[]).filter(a=>!a.dismissed).length>0?`<span style="background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;margin-left:4px">${(DB.bva_alerts||[]).filter(a=>!a.dismissed).length}</span>`:''}</button>
  </div><div class="card-body" id="bvaTabContent"></div></div>`;
  $('pageActions').innerHTML=`<select class="form-input" style="width:auto;padding:4px 8px" onchange="bvaYear=parseInt(this.value);renderBVA()"><option value="2026"${bvaYear===2026?' selected':''}>2026</option><option value="2025"${bvaYear===2025?' selected':''}>2025</option></select> <button class="btn btn-secondary btn-sm" onclick="loadBVActualsFromGL()">Load Actuals from GL</button> <button class="btn btn-primary btn-sm" onclick="window.open(API+'/bva/export/csv?year='+bvaYear+'&token='+token)">Export CSV</button>`;
  const tc=$('bvaTabContent');
  if(bvaTab==='overview')await renderBVAOverview(tc);
  else if(bvaTab==='budget')await renderBVABudget(tc);
  else if(bvaTab==='cashflow')await renderBVACashflow(tc);
  else if(bvaTab==='workforce')await renderBVAWorkforce(tc);
  else if(bvaTab==='field')await renderBVAField(tc);
  else if(bvaTab==='scenario')await renderBVAScenario(tc);
  else if(bvaTab==='forecast')await renderBVAForecast(tc);
  else if(bvaTab==='alerts')await renderBVAAlerts(tc);
};
async function loadBVActualsFromGL(){
  try{
    const actuals=await api('/integration/bva-actuals-from-gl?year='+bvaYear);
    let count=0;
    for(const[period,data]of Object.entries(actuals)){
      const month=parseInt(period.split('-')[1]);
      if(month<7)continue;
      const existing=(DB.bva_actuals||[]).find(a=>a.period===period);
      if(existing){existing.amount=data.total;count++;}
      else{
        if(!DB.bva_actuals)DB.bva_actuals=[];
        DB.bva_actuals.push({id:'bva-act-'+Date.now()+'-'+Math.random().toString(36).slice(2,5),period,amount:data.total,category:'general',description:'Auto-loaded from GL',year:bvaYear,createdAt:new Date().toISOString()});
        count++;
      }
    }
    showToast('Loaded '+count+' period actuals from GL');
    renderBVA();
  }catch(e){showToast('Failed to load actuals: '+e.message);}
}
async function renderBVAOverview(tc){
  const d=await api('/bva/dashboard?year='+bvaYear);
  if(!d){tc.innerHTML='<div style="padding:40px;text-align:center;color:var(--gray500)">Loading BVA data...</div>';return;}
  const varAbs=d.variance;
  const varPct=d.totalBudget?Math.round(varAbs/d.totalBudget*1000)/10:0;
  tc.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px">
    <div class="bva-kpi g"><div class="bva-kpi-label">Total Budget</div><div class="bva-kpi-value" style="color:var(--green)">${fmtBVA(d.totalBudget)}</div></div>
    <div class="bva-kpi o"><div class="bva-kpi-label">Total Actual</div><div class="bva-kpi-value" style="color:var(--amber)">${fmtBVA(d.totalActual)}</div></div>
    <div class="bva-kpi ${varAbs>0?'r':'g'}"><div class="bva-kpi-label">Variance</div><div class="bva-kpi-value" style="color:${varAbs>0?'var(--red)':'var(--green)'}">${fmtBVAS(varAbs)}</div><div class="bva-kpi-sub">${varPct>0?'+':''}${varPct}% of budget</div></div>
    <div class="bva-kpi"><div class="bva-kpi-label">Income H1</div><div class="bva-kpi-value">${fmtBVA(d.totalIncome)}</div></div>
    <div class="bva-kpi p"><div class="bva-kpi-label">Active Alerts</div><div class="bva-kpi-value">${d.alerts.length}</div></div>
    <div class="bva-kpi"><div class="bva-kpi-label">Avg Workforce</div><div class="bva-kpi-value">${d.avgWorkforce}</div><div class="bva-kpi-sub">Per day</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
    <div class="card" style="margin:0"><div class="card-header"><h3 style="font-size:13px">Monthly Budget vs Actual</h3></div><div class="card-body"><canvas id="bvaChartMBA" height="200"></canvas></div></div>
    <div class="card" style="margin:0"><div class="card-header"><h3 style="font-size:13px">Spend by Category</h3></div><div class="card-body"><canvas id="bvaChartPie" height="200"></canvas></div></div>
  </div>

      <div class="stat-card"><div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><div class="stat-value">${stats?.todayUploads||0}</div><div class="stat-label">Today</div></div>
      <div class="stat-card"><div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/></svg></div><div class="stat-value">${stats?.checkedOut||0}</div><div class="stat-label">Checked Out</div></div>

function formatSize(bytes){if(bytes===0)return'0 B';const k=1024;const sizes=['B','KB','MB','GB'];const i=Math.floor(Math.log(bytes)/Math.log(k));return parseFloat((bytes/Math.pow(k,i)).toFixed(1))+' '+sizes[i]}
function renderDMSCategories(cats,stats){
  const el=document.getElementById('dmsCategoryCards');if(!el)return;
  const byCat={};(stats?.byCategory||[]).forEach(c=>byCat[c.id]=c.count);
  el.innerHTML=(cats||[]).map(c=>`<div style="background:#111828;border:1px solid ${dmsCategory===c.id?c.color:'#1a2540'};padding:14px;cursor:pointer;transition:all .15s;border-left:3px solid ${c.color}" onclick="dmsCategory='${c.id}';dmsPage=1;document.getElementById('dmsCatFilter').value='${c.id}';loadDMSDocs()"><div style="font-weight:500;font-size:13px;margin-bottom:4px">${c.name}</div><div style="font-size:12px;color:var(--gray500)">${byCat[c.id]||0} documents</div></div>`).join('');
}
async function loadDMSDocs(){
  const cat=document.getElementById('dmsCatFilter')?.value||'';
  const type=document.getElementById('dmsTypeFilter')?.value||'';
  const search=document.getElementById('dmsSearchInput')?.value||'';
  const r=await api(`/dms/documents?category=${cat}&type=${type}&search=${encodeURIComponent(search)}&page=${dmsPage}&limit=20`);
  if(!r||!r.data)return;
  const tb=document.getElementById('dmsDocsTable');
  if(!tb)return;
  if(r.data.length===0){tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--gray500)">No documents found. Upload your first document!</td></tr>';return;}
  tb.innerHTML=r.data.map(d=>{
    const cats2=window._dmsCats||[];
    const catObj=cats2.find(c=>c.id===d.categoryId);
    const typeLabels={invoice:'Invoice',purchase_order:'Purchase Order',sales_order:'Sales Order',delivery_note:'Delivery Note',contract:'Contract',certificate:'Certificate',data_sheet:'Data Sheet',correspondence:'Correspondence',hr:'HR',general:'General'};
    const wfBadge=d.workflowStatus==='in_progress'?`<span class="badge badge-info">In Workflow</span>`:d.workflowStatus==='approved'?`<span class="badge badge-success">Approved</span>`:d.workflowStatus==='rejected'?`<span class="badge badge-danger">Rejected</span>`:'';
    const ext=(d.originalName||'').split('.').pop().toLowerCase();
    const extClass=ext==='pdf'?'pdf':['doc','docx'].includes(ext)?'doc':['xls','xlsx'].includes(ext)?'xls':['jpg','jpeg','png','gif','bmp','svg','webp'].includes(ext)?'img':'other';
    const extLabel=ext==='pdf'?'PDF':['doc','docx'].includes(ext)?'DOC':['xls','xlsx'].includes(ext)?'XLS':['jpg','jpeg','png','gif','bmp','svg','webp'].includes(ext)?'IMG':ext.toUpperCase().substring(0,4);
    const stampColor=d.stampStatus==='APPROVED'?'var(--green)':d.stampStatus==='REJECTED'?'var(--red)':d.stampStatus==='PAID'?'var(--green)':d.stampStatus==='DRAFT'?'var(--amber)':d.stampStatus==='CONFIDENTIAL'?'#ec4899':d.stampStatus==='CANCELLED'?'var(--red)':'var(--gray500)';
    const stampBorder=d.stampStatus==='APPROVED'?'var(--green)':d.stampStatus==='REJECTED'?'var(--red)':d.stampStatus==='PAID'?'var(--green)':'var(--gray500)';
    const stampBadge=d.stampStatus?`<span style="font-size:9px;font-weight:700;padding:1px 5px;border:2px solid ${stampBorder};border-radius:3px;color:${stampColor};margin-left:8px;letter-spacing:.5px;transform:rotate(-2deg);display:inline-block">${d.stampStatus}</span>`:'';
    const delBadge=d.deletionStatus==='marked'?`<span class="badge badge-danger" style="margin-left:4px">Marked for Deletion</span>`:'';
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:10px"><div class="dms-file-type ${extClass}">${extLabel}</div><div><div style="font-weight:500;font-size:13px">${d.originalName||d.docNum}${stampBadge}</div><div style="font-size:11px;color:var(--gray500)">${d.docNum||''}${d.checkedOut?'<span style="color:var(--amber);margin-left:6px">🔒 Checked Out</span>':''}</div></div></div></td>
      <td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${catObj?.color||'var(--gray500)'};margin-right:6px"></span>${catObj?.name||'—'}</td>
      <td style="font-size:12px">${typeLabels[d.type]||d.type||'—'}</td>
      <td style="font-size:12px">${formatSize(d.fileSize||0)}</td>
      <td style="font-size:12px">${d.uploadedByName||'—'}</td>
      <td style="font-size:12px">${d.createdAt?new Date(d.createdAt).toLocaleDateString():'—'}</td>
      <td>${wfBadge}${delBadge}</td>
      <td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="viewDMSDoc('${d.id}')" title="View">👁</button> <button class="btn btn-ghost btn-sm" onclick="downloadDMSFile('${d.id}','${d.originalName}')" title="Download">↓</button> ${d.checkedOut?`<button class="btn btn-ghost btn-sm" onclick="checkinDMSDoc('${d.id}')" title="Check In">📝</button>`:`<button class="btn btn-ghost btn-sm" onclick="checkoutDMSDoc('${d.id}')" title="Check Out">🔒</button>`} ${!d.workflowStatus||d.workflowStatus==='none'?`<button class="btn btn-ghost btn-sm" onclick="openStartWorkflowModal('${d.id}','${d.originalName}')" title="Start Workflow">⚡</button>`:''} <button class="btn btn-ghost btn-sm" onclick="openStampModal('${d.id}','${d.originalName}')" title="Stamp">🖊</button> <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="requestDMSDeletion('${d.id}','${d.originalName}')" title="Delete">🗑</button></td></tr>`;
  }).join('');
  const pg=document.getElementById('dmsPagination');
  if(pg&&r.pages>1){pg.innerHTML=Array.from({length:Math.min(r.pages,5)},(_,i)=>`<button class="btn btn-ghost btn-sm${i+1===r.page?' active':''}" onclick="dmsPage=${i+1};loadDMSDocs()" style="${i+1===r.page?'color:var(--cyan);font-weight:600':''}">${i+1}</button>`).join('');}
}
function openDMSUploadModal(){
  api('/dms/categories').then(cats=>{
    window._dmsCats=cats;
    openModal(`<div class="modal-header"><h3 class="modal-title">Upload Document</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form id="dmsUploadForm" onsubmit="submitDMSUpload(event)">
      <div class="dms-dropzone" id="dmsDropzone" onclick="document.getElementById('dmsFileInput').click()">
        <input type="file" class="form-input" name="file" id="dmsFileInput" style="display:none" required onchange="handleDMSFileSelect(this)">
        <div class="dms-dropzone-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="1.5" width="32" height="32"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        <div id="dmsDropText" style="font-size:14px;font-weight:500;margin-bottom:4px">Drag & drop file here or click to browse</div>
        <div id="dmsFileName" style="font-size:12px;color:var(--cyan);font-weight:500"></div>
        <div style="font-size:11px;color:var(--gray500);margin-top:8px">PDF, Word, Excel, Images, Text, CSV — Max 50MB</div>
      </div>
      <div class="form-row"><div class="form-group"><label class="form-label">Category</label><select class="form-input" name="categoryId">${cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
      <div class="form-group"><label class="form-label">Document Type</label><select class="form-input" name="type"><option value="general">General</option><option value="invoice">Invoice</option><option value="purchase_order">Purchase Order</option><option value="sales_order">Sales Order</option><option value="delivery_note">Delivery Note</option><option value="contract">Contract</option><option value="certificate">Certificate</option><option value="data_sheet">Data Sheet</option><option value="correspondence">Correspondence</option><option value="hr">HR Document</option></select></div></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" name="description" rows="2" placeholder="Describe this document..."></textarea></div>
      <div class="form-group"><label class="form-label">Keywords (comma separated)</label><input class="form-input" name="keywords" placeholder="e.g. Q4, 2024, supplier-name"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary" id="dmsUploadBtn">Upload Document</button></div>
    </form>`);
    // Setup drag and drop
    setTimeout(()=>{
      const dz=document.getElementById('dmsDropzone');
      if(!dz)return;
      ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.add('dragover')}));
      ['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ev.preventDefault();dz.classList.remove('dragover')}));
      dz.addEventListener('drop',ev=>{
        const files=ev.dataTransfer.files;
        if(files.length>0){
          const fi=document.getElementById('dmsFileInput');
          fi.files=files;
          handleDMSFileSelect(fi);
        }
      });
    },100);
  });
}
function handleDMSFileSelect(input){
  const f=input.files[0];
  if(!f)return;
  const dn=document.getElementById('dmsFileName');
  const dt=document.getElementById('dmsDropText');
  if(dn)dn.textContent=f.name+' ('+formatSize(f.size)+')';
  if(dt)dt.textContent='File selected — ready to upload';
  const dz=document.getElementById('dmsDropzone');
  if(dz)dz.style.borderColor='var(--green)';
}
async function submitDMSUpload(e){
  e.preventDefault();
  const form=document.getElementById('dmsUploadForm');
  const fileInput=document.getElementById('dmsFileInput');
  if(!fileInput.files[0]){showToast('Please select a file','error');return;}
  const fd=new FormData();
  fd.append('file',fileInput.files[0]);
  const fd2=new FormData(form);
  for(const [k,v] of fd2.entries()){if(k!=='file')fd.append(k,v);}
  const r=await fetch(API+'/dms/documents',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});
  if(r.ok){closeModal();showToast('Document uploaded successfully');loadDMSDocs();}else{showToast('Upload failed','error');}
}
async function viewDMSDoc(id){
  const doc=await api('/dms/documents/'+id);
  if(!doc)return;
  const isPDF=doc.mimeType?.includes('pdf');
  const isImage=doc.mimeType?.includes('image');
  const ext=(doc.originalName||'').split('.').pop().toLowerCase();
  const extClass=ext==='pdf'?'pdf':['doc','docx'].includes(ext)?'doc':['xls','xlsx'].includes(ext)?'xls':['jpg','jpeg','png','gif'].includes(ext)?'img':'other';
  const stampColor=doc.stampStatus==='APPROVED'?'var(--green)':doc.stampStatus==='REJECTED'?'var(--red)':doc.stampStatus==='DRAFT'?'var(--amber)':doc.stampStatus==='CONFIDENTIAL'?'#ec4899':'var(--gray500)';
  let wfProgress='';
  if(doc.workflowStatus&&doc.workflowStatus!=='none'){
    const steps=await api('/dms/workflows/'+doc.activeWorkflowId);
    const approvals=doc.approvals||[];
    if(steps&&steps.steps){
      wfProgress=`<div class="card" style="margin:12px 0;padding:16px"><div style="font-weight:500;font-size:13px;margin-bottom:12px;color:var(--cyan)">⚡ Workflow Progress</div><div class="dms-wf-progress">`;
      steps.steps.forEach((s,i)=>{
        const app=approvals.find(a=>a.stepOrder===s.stepOrder);
        let status='pending';
        if(app){
          if(app.status==='approved')status='done';
          else if(app.status==='rejected')status='rejected';
          else if(app.status==='pending'&&app.assigneeId)status='active';
        }
        const icon=status==='done'?'✓':status==='rejected'?'✗':status==='active'?'►':(i+1);
        wfProgress+=`<div class="dms-wf-step ${status}"><div class="dms-wf-dot ${status}">${icon}</div><div class="dms-wf-label">${s.stepName}</div></div>`;
      });
      wfProgress+=`</div></div>`;
    }
  }
  let stampOverlay='';
  if(isImage&&(doc.stampStatus||'').length>0){
    stampOverlay=`<div class="dms-stamp-overlay ${doc.stampStatus}">${doc.stampStatus}</div>`;
  }
  openModal(`<div class="modal-header"><h3 class="modal-title"><span class="dms-file-type ${extClass}" style="display:inline-flex;width:28px;height:28px;font-size:9px;vertical-align:middle;margin-right:8px">${ext.toUpperCase().substring(0,4)}</span>${doc.originalName}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div style="margin-bottom:16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px;background:var(--bg-secondary,#0d1220);padding:12px;border-radius:6px">
        <div><span style="color:var(--gray500)">Doc #:</span> <b>${doc.docNum}</b></div>
        <div><span style="color:var(--gray500)">Version:</span> <b>v${doc.version||1}</b></div>
        <div><span style="color:var(--gray500)">Size:</span> ${formatSize(doc.fileSize||0)}</div>
        <div><span style="color:var(--gray500)">Type:</span> ${doc.type||'general'}</div>
        <div><span style="color:var(--gray500)">Uploaded by:</span> ${doc.uploadedByName||'—'}</div>
        <div><span style="color:var(--gray500)">Date:</span> ${doc.createdAt?new Date(doc.createdAt).toLocaleString():'—'}</div>
        ${doc.workflowStatus&&doc.workflowStatus!=='none'?`<div><span style="color:var(--gray500)">Workflow:</span> <span class="badge badge-${doc.workflowStatus==='approved'?'success':doc.workflowStatus==='rejected'?'danger':'info'}">${doc.workflowStatus}</span></div>`:''}
        ${doc.stampStatus?`<div><span style="color:var(--gray500)">Stamp:</span> <span style="font-weight:700;color:${stampColor}">${doc.stampStatus}</span></div>`:''}
        ${doc.checkedOut?`<div><span style="color:var(--amber)">🔒 Checked Out</span></div>`:''}
      </div>

function downloadDMSFile(id,name){window.open(API+'/dms/files/'+id+'?token='+token);showToast('Downloading '+name)}
async function checkoutDMSDoc(id){const r=await api('/dms/documents/'+id+'/checkout',{method:'POST'});if(r&&!r.error){showToast('Document checked out');loadDMSDocs();}else{showToast(r?.error||'Checkout failed','error');}}
async function checkinDMSDoc(id){
  openModal(`<div class="modal-header"><h3 class="modal-title">Check In Document</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form id="checkinForm" onsubmit="submitCheckin(event,'${id}')"><div class="form-group"><label class="form-label">New Version File (optional)</label><input type="file" class="form-input" name="file" id="checkinFile"></div><div class="form-group"><label class="form-label">Version Comment</label><textarea class="form-input" name="comment" rows="2" placeholder="What changed in this version?"></textarea></div><div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Check In</button></div></form>`);
}
async function submitCheckin(e,id){
  e.preventDefault();
  const form=document.getElementById('checkinForm');
  const fileInput=document.getElementById('checkinFile');
  const fd=new FormData();
  if(fileInput.files[0])fd.append('file',fileInput.files[0]);
  fd.append('comment',form.comment?.value||'');
  const r=await fetch(API+'/dms/documents/'+id+'/checkin?token='+token,{method:'POST',body:fd});
  if(r.ok){closeModal();showToast('Document checked in');loadDMSDocs();}else{showToast('Check-in failed','error');}
}
async function deleteDMSDoc(id,name){

  const r=await api('/dms/documents/'+id,{method:'DELETE'});

}

  tc.innerHTML=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px">${wfs.map(w=>{
    const steps=w.steps||[];
    return `<div class="card" style="border-left:3px solid var(--cyan)"><div class="card-header"><span class="card-title">${w.name}</span><span class="badge badge-${w.status==='active'?'success':'gray'}">${w.status}</span></div><div class="card-body"><p style="font-size:12px;color:var(--gray500);margin-bottom:12px">${w.description||''}</p><div style="font-size:12px;font-weight:500;margin-bottom:8px">Steps (${steps.length}):</div>${steps.map(s=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1a2540;font-size:12px"><span style="width:24px;height:24px;border-radius:50%;background:var(--cyan);color:#000;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;flex-shrink:0">${s.order}</span><div><div style="font-weight:500">${s.name}</div><div style="color:var(--gray500)">${s.assigneeRole} • ${s.action} ${s.mandatory?'• <span style="color:var(--amber)">Mandatory</span>':''}</div></div></div>`).join('')}<div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-ghost btn-sm" onclick="editDMSWorkflow('${w.id}')">Edit</button><button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="deleteDMSWorkflow('${w.id}','${w.name}')">Delete</button></div></div></div>`;
  }).join('')}</div>`;
}
function openDMSWorkflowModal(wf){
  const isEdit=!!wf;
  openModal(`<div class="modal-header"><h3 class="modal-title">${isEdit?'Edit':'New'} Workflow</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <form id="wfForm" onsubmit="saveDMSWorkflow(event${isEdit?",'"+wf.id+"'":''})">
      <div class="form-group"><label class="form-label">Name *</label><input class="form-input" name="name" value="${wf?.name||''}" required></div>
      <div class="form-group"><label class="form-label">Description</label><textarea class="form-input" name="description" rows="2">${wf?.description||''}</textarea></div>
      <div class="form-group"><label class="form-label">Workflow Steps</label><div id="wfStepsContainer">${(wf?.steps||[{name:'',assigneeRole:'user',action:'review',mandatory:true}]).map((s,i)=>`<div style="display:flex;gap:8px;margin-bottom:8px;align-items:center"><input class="form-input" style="flex:1" name="stepName_${i}" placeholder="Step name" value="${s.name||''}" required><select class="form-input" style="width:100px" name="stepRole_${i}"><option value="user"${s.assigneeRole==='user'?' selected':''}>User</option><option value="admin"${s.assigneeRole==='admin'?' selected':''}>Admin</option><option value="accounting"${s.assigneeRole==='accounting'?' selected':''}>Accounting</option></select><select class="form-input" style="width:100px" name="stepAction_${i}"><option value="review"${s.action==='review'?' selected':''}>Review</option><option value="approve"${s.action==='approve'?' selected':''}>Approve</option></select><label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" name="stepMandatory_${i}" ${s.mandatory?'checked':''}> Req</label><button type="button" class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="this.parentElement.remove()">✕</button></div>`).join('')}</div><button type="button" class="btn btn-ghost btn-sm" onclick="addWorkflowStep()" style="margin-top:4px">+ Add Step</button></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">${isEdit?'Update':'Create'} Workflow</button></div>
    </form>`);
}
function addWorkflowStep(){
  const c=document.getElementById('wfStepsContainer');if(!c)return;
  const i=c.children.length;
  const div=document.createElement('div');div.style.cssText='display:flex;gap:8px;margin-bottom:8px;align-items:center';
  div.innerHTML=`<input class="form-input" style="flex:1" name="stepName_${i}" placeholder="Step name" required><select class="form-input" style="width:100px" name="stepRole_${i}"><option value="user">User</option><option value="admin">Admin</option><option value="accounting">Accounting</option></select><select class="form-input" style="width:100px" name="stepAction_${i}"><option value="review">Review</option><option value="approve">Approve</option></select><label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" name="stepMandatory_${i}" checked> Req</label><button type="button" class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="this.parentElement.remove()">✕</button>`;
  c.appendChild(div);
}
async function saveDMSWorkflow(e,editId){
  e.preventDefault();const form=document.getElementById('wfForm');
  const steps=[];let i=0;
  while(form.elements['stepName_'+i]){if(form.elements['stepName_'+i].value)steps.push({name:form.elements['stepName_'+i].value,assigneeRole:form.elements['stepRole_'+i].value,action:form.elements['stepAction_'+i].value,mandatory:form.elements['stepMandatory_'+i]?.checked||false});i++;}
  const body={name:form.elements.name.value,description:form.elements.description.value,steps};
  const r=editId?await api('/dms/workflows/'+editId,{method:'PUT',body:JSON.stringify(body)}):await api('/dms/workflows',{method:'POST',body:JSON.stringify(body)});
  if(r&&!r.error){closeModal();showToast('Workflow '+(editId?'updated':'created'));loadDMSWorkflows();}else{showToast('Error','error');}
}
async function editDMSWorkflow(id){const r=await api('/dms/workflows');const wf=(r||[]).find(w=>w.id===id);if(wf)openDMSWorkflowModal(wf);}
async function deleteDMSWorkflow(id,name){if(!confirm('Delete workflow "'+name+'"?'))return;const r=await api('/dms/workflows/'+id,{method:'DELETE'});if(r?.success){showToast('Workflow deleted');loadDMSWorkflows();}}

let advPage=1;
async function runAdvSearch(){
  const params=new URLSearchParams();
  const q=document.getElementById('advQ')?.value; if(q)params.set('q',q);
  const kw=document.getElementById('advKeyword')?.value; if(kw)params.set('keyword',kw);
  const cat=document.getElementById('advCategory')?.value; if(cat)params.set('category',cat);
  const type=document.getElementById('advType')?.value; if(type)params.set('type',type);
  const df=document.querySelector('#advDateFrom_wrap input[type=hidden]')?.value; if(df)params.set('dateFrom',df);
  const dt=document.querySelector('#advDateTo_wrap input[type=hidden]')?.value; if(dt)params.set('dateTo',dt);
  const wf=document.getElementById('advWfStatus')?.value; if(wf)params.set('workflowStatus',wf);
  const st=document.getElementById('advStampStatus')?.value; if(st)params.set('stampStatus',st);
  params.set('page',advPage);params.set('limit','20');
  const r=await api('/dms/advanced-search?'+params.toString());
  if(!r||!r.data)return;
  const tb=document.getElementById('advResults');if(!tb)return;
  if(r.data.length===0){tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--gray500)">No results found</td></tr>';return;}
  const cats=window._dmsCats||[];
  tb.innerHTML=r.data.map(d=>{
    const catObj=cats.find(c=>c.id===d.categoryId);
    const wfBadge=d.workflowStatus==='in_progress'?'<span class="badge badge-info">In WF</span>':d.workflowStatus==='approved'?'<span class="badge badge-success">Approved</span>':d.workflowStatus==='rejected'?'<span class="badge badge-danger">Rejected</span>':'—';
    const stampBadge=d.stampStatus?`<span style="font-size:10px;font-weight:700;padding:1px 5px;border:1px solid var(--cyan);color:var(--cyan)">${d.stampStatus}</span>`:'—';
    return `<tr><td style="font-weight:500;font-size:13px">${d.originalName||d.docNum}</td><td style="font-size:12px">${catObj?.name||'—'}</td><td style="font-size:12px">${d.type||'—'}</td><td style="font-size:12px">${d.createdAt?new Date(d.createdAt).toLocaleDateString():'—'}</td><td style="font-size:12px">${formatSize(d.fileSize||0)}</td><td>${wfBadge}</td><td>${stampBadge}</td><td><button class="btn btn-ghost btn-sm" onclick="viewDMSDoc('${d.id}')">View</button></td></tr>`;
  }).join('');
  const pg=document.getElementById('advPagination');
  if(pg&&r.pages>1){pg.innerHTML=Array.from({length:Math.min(r.pages,5)},(_,i)=>`<button class="btn btn-ghost btn-sm${i+1===r.page?' active':''}" onclick="advPage=${i+1};runAdvSearch()">${i+1}</button>`).join('');}
}

async function saveResubmission(id){

  const r=await api('/dms/documents/'+id+'/resubmission',{method:'POST',body:JSON.stringify({resubmissionDate:date,resubmissionNote:note})});
  if(r&&!r.error){closeModal();showToast('Resubmission date set');loadDMSAdvanced();}else{showToast('Error','error');}

  </div>

  <div class="card"><div class="table-wrap"><table><thead><tr><th>Document</th><th>Keywords</th><th>Status</th><th>Actions</th></tr></thead><tbody>${docs.slice(0,50).map(d=>`<tr>

    <td>${d.ocrExtracted?'<span class="badge badge-success">Processed</span>':'<span class="badge badge-gray">Pending</span>'}</td>
    <td><button class="btn btn-ghost btn-sm" onclick="runOCRSingle('${d.id}')">Extract Keywords</button></td>
  </tr>`).join('')}</tbody></table></div></div>`;
}
async function runOCRSingle(id){const r=await api('/dms/documents/'+id+'/ocr-extract',{method:'POST'});if(r&&!r.error){showToast(`Extracted ${r.totalExtracted} keywords`);loadDMSAdvanced();}else{showToast('Error','error');}}
async function runOCRAll(){
  const docs=(await api('/dms/documents'))?.data||[];
  const unprocessed=docs.filter(d=>!d.ocrExtracted);
  let count=0;
  for(const d of unprocessed){await api('/dms/documents/'+d.id+'/ocr-extract',{method:'POST'});count++;}
  showToast(`Processed ${count} documents`);loadDMSAdvanced();
}

let auditPage=1;
async function loadAuditTrail(){
  const table=document.getElementById('auditTableFilter')?.value||'';
  const action=document.getElementById('auditActionFilter')?.value||'';
  const search=document.getElementById('auditSearch')?.value||'';
  const r=await api(`/audit-trail?table=${table}&action=${action}&search=${encodeURIComponent(search)}&page=${auditPage}&limit=20`);
  if(!r||!r.data)return;
  const tb=document.getElementById('auditTable');
  if(!tb)return;
  if(r.data.length===0){tb.innerHTML='<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--gray500)">No audit events recorded yet</td></tr>';return;}
  tb.innerHTML=r.data.map(l=>{
    const actionColor=l.action==='CREATE'?'var(--green)':l.action==='DELETE'?'var(--red)':'var(--cyan)';
    const actionIcon=l.action==='CREATE'?'＋':l.action==='DELETE'?'✕':'✎';
    let changesHtml='';
    if(l.changes&&Object.keys(l.changes).length>0){
      changesHtml=Object.entries(l.changes).map(([k,v])=>`<span style="font-size:11px"><b>${k}</b>: ${JSON.stringify(v.from||'').substring(0,30)} → ${JSON.stringify(v.to||'').substring(0,30)}</span>`).join('<br>');
    }else if(l.oldData){changesHtml='<span style="font-size:11px;color:var(--red)">Record deleted</span>';}
    else{changesHtml='<span style="font-size:11px;color:var(--gray500)">—</span>';}
    return `<tr><td style="white-space:nowrap;font-size:12px;color:var(--gray500)">${l.timestamp?new Date(l.timestamp).toLocaleString():'—'}</td>
    <td style="font-weight:500;font-size:13px">${l.username||'system'}</td>
    <td><span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:${actionColor}22;color:${actionColor}">${actionIcon} ${l.action}</span></td>
    <td style="font-size:13px">${l.table||'—'}</td>
    <td style="font-size:13px;font-weight:500">${l.recordLabel||'—'}</td>
    <td style="max-width:300px;overflow:hidden">${changesHtml}</td></tr>`;
  }).join('');
  const pg=document.getElementById('auditPagination');
  if(pg&&r.pages>1){pg.innerHTML=Array.from({length:Math.min(r.pages,5)},(_,i)=>`<button class="btn btn-ghost btn-sm${i+1===r.page?' active':''}" onclick="auditPage=${i+1};loadAuditTrail()" style="${i+1===r.page?'color:var(--cyan);font-weight:600':''}">${i+1}</button>`).join('');}
}

async function saveSettings(e){
  e.preventDefault();const fd=new FormData(e.target);const obj={};
  fd.forEach((v,k)=>{
    if(k==='taxesEnabled'||k==='includeTaxOnDocs'||k==='suppressTaxRates'||k==='autoIncrementRefs'||k==='showLogoOnReports'||k==='autoPrintDialog'||k==='emailNewOrder'||k==='emailOrderStatus'||k==='emailLowStock'||k==='emailNewTicket'||k==='emailPayroll'||k==='emailManufacturing'){
      obj[k]=true;
    }else{
      obj[k]=v;
    }
  });
  if(obj.taxRate)obj.taxRate=parseFloat(obj.taxRate);
  if(obj.costPlusMarkup)obj.costPlusMarkup=parseFloat(obj.costPlusMarkup);
  if(obj.roundPricesTo)obj.roundPricesTo=parseFloat(obj.roundPricesTo);
  if(obj.autoLogoutTimeout)obj.autoLogoutTimeout=parseInt(obj.autoLogoutTimeout);
  if(obj.minPasswordLength)obj.minPasswordLength=parseInt(obj.minPasswordLength);
  await api('/settings',{method:'PUT',body:JSON.stringify(obj)});showToast('Settings saved');
}

// ====== REAL-TIME EVENT BUS (WebSocket) ======
let eventWs=null;
let eventLog=[];
function connectEventBus(){
  try{
    eventWs=new WebSocket('ws://localhost:3001');
    eventWs.onopen=()=>{console.log('[EventBus] Connected')};
    eventWs.onmessage=(e)=>{
      try{
        const msg=JSON.parse(e.data);
        if(msg.type==='event'){
          const ev=msg.payload;
          eventLog.unshift(ev);
          if(eventLog.length>200)eventLog=eventLog.slice(0,200);
          addRealTimeNotification(ev);
          updateEventBadge();
        }
      }catch(err){}
    };
    eventWs.onclose=()=>{console.log('[EventBus] Disconnected, reconnecting in 5s...');setTimeout(connectEventBus,5000)};
    eventWs.onerror=()=>{eventWs.close()};
  }catch(e){console.log('[EventBus] WS error',e)}
}
function addRealTimeNotification(ev){
  const list=$('notificationsList');
  if(!list)return;
  const colorMap={'invoice.created':'var(--green)','bill.created':'var(--amber)','journal.posted':'var(--cyan)','payroll.processed':'var(--purple)','mo.completed':'var(--green)','mo.started':'var(--blue)','workflow.started':'var(--teal)','workflow.completed':'var(--green)','workflow.rejected':'var(--red)','workflow.step_approved':'var(--cyan)'};
  const titleMap={'invoice.created':'Invoice Created','bill.created':'Bill Created','journal.posted':'Journal Posted','payroll.processed':'Payroll Processed','mo.completed':'MO Completed','mo.started':'MO Started','workflow.started':'Workflow Started','workflow.completed':'Workflow Completed','workflow.rejected':'Workflow Rejected','workflow.step_approved':'Workflow Step Approved','mo.cancelled':'MO Cancelled','mo.updated':'MO Updated','workflow.created':'Workflow Created','payroll.bulk_processed':'Bulk Payroll Processed'};
  const moduleMap={'ar':'orders','ap':'orders','accounting':'system','payroll':'system','manufacturing':'inventory','system':'system'};
  const notif=document.createElement('div');
  notif.className='notifications-item unread';
  notif.dataset.type=moduleMap[ev.module]||'system';
  notif.innerHTML=`<div class="notifications-dot" style="background:${colorMap[ev.type]||'var(--cyan)'}"></div><div class="notifications-content"><div class="title">${titleMap[ev.type]||ev.type}</div><div class="desc">${ev.data?.invoiceNumber||ev.data?.billNumber||ev.data?.entryNumber||ev.data?.moNumber||ev.data?.workflowName||ev.module} ${ev.username?'by '+ev.username:''}</div><div class="time">${timeAgo(ev.timestamp)}</div></div>`;
  list.prepend(notif);
  const count=list.querySelectorAll('.notifications-item').length;
  if(count>50)list.lastChild.remove();
}
function timeAgo(ts){
  const diff=(Date.now()-new Date(ts).getTime())/1000;
  if(diff<60)return 'Just now';
  if(diff<3600)return Math.floor(diff/60)+'m ago';
  if(diff<86400)return Math.floor(diff/3600)+'h ago';
  return Math.floor(diff/86400)+'d ago';
}

// ====== CALENDAR DATE PICKER ======
function calDate(name,value,label,id){
  const uid=id||'cal_'+name+'_'+Math.random().toString(36).slice(2,6);
  const today=new Date();
  const v=value||'';
  const display=v?new Date(v+'T00:00:00').toLocaleDateString('en-ZA',{year:'numeric',month:'short',day:'numeric'}):'';
  return `<div class="cal-wrap" id="${uid}_wrap"><input type="hidden" name="${name}" value="${v}"><input type="text" class="cal-input" id="${uid}" value="${display}" placeholder="Select date..." readonly onclick="openCal('${uid}')"><span class="cal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><div class="cal-dropdown" id="${uid}_dd"></div></div>`;
}
const _calState={};
function openCal(uid){
  const wrap=document.getElementById(uid+'_wrap');
  const dd=document.getElementById(uid+'_dd');
  if(!wrap||!dd)return;
  document.querySelectorAll('.cal-dropdown.open').forEach(d=>{if(d!==dd)d.classList.remove('open')});
  const hidden=wrap.querySelector('input[type=hidden]');
  const cur=hidden.value||'';
  if(!_calState[uid]){
    const now=cur?new Date(cur+'T00:00:00'):new Date();
    _calState[uid]={year:now.getFullYear(),month:now.getMonth()};
  }
  renderCalDays(uid);
  dd.classList.add('open');
  setTimeout(()=>{document.addEventListener('click',function calClose(e){if(!wrap.contains(e.target)){dd.classList.remove('open');document.removeEventListener('click',calClose)}},{once:true})},10);
}
function renderCalDays(uid){
  const dd=document.getElementById(uid+'_dd');
  if(!dd)return;
  const s=_calState[uid];
  const today=new Date();const todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const hidden=dd.closest('.cal-wrap').querySelector('input[type=hidden]');
  const sel=hidden.value||'';
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const weekdays=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const first=new Date(s.year,s.month,1).getDay();
  const daysInMonth=new Date(s.year,s.month+1,0).getDate();
  const daysInPrev=new Date(s.year,s.month,0).getDate();
  let html=`<div class="cal-nav"><button onclick="calNav('${uid}',-1)">&lsaquo;</button><span>${months[s.month]} ${s.year}</span><button onclick="calNav('${uid}',1)">&rsaquo;</button></div>`;
  html+=`<div class="cal-weekdays">${weekdays.map(w=>`<span>${w}</span>`).join('')}</div><div class="cal-days">`;
  for(let i=0;i<first;i++){
    const d=daysInPrev-first+i+1;
    const pm=s.month===0?11:s.month-1;const py=s.month===0?s.year-1:s.year;
    const ds=py+'-'+String(pm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    html+=`<button class="other-month" onclick="pickCal('${uid}','${ds}')">${d}</button>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const ds=s.year+'-'+String(s.month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const cls=ds===todayStr?'today':ds===sel?'selected':'';
    html+=`<button class="${cls}" onclick="pickCal('${uid}','${ds}')">${d}</button>`;
  }
  const total=first+daysInMonth;const rem=total%7===0?0:7-total%7;
  for(let d=1;d<=rem;d++){
    const nm=s.month===11?0:s.month+1;const ny=s.month===11?s.year+1:s.year;
    const ds=ny+'-'+String(nm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    html+=`<button class="other-month" onclick="pickCal('${uid}','${ds}')">${d}</button>`;
  }
  html+=`</div><button class="cal-clear" onclick="clearCal('${uid}')">Clear</button>`;
  dd.innerHTML=html;
}
function calNav(uid,dir){
  const s=_calState[uid];if(!s)return;
  s.month+=dir;
  if(s.month>11){s.month=0;s.year++}
  if(s.month<0){s.month=11;s.year--}
  renderCalDays(uid);
}
function pickCal(uid,val){
  const wrap=document.getElementById(uid+'_wrap');
  if(!wrap)return;
  const hidden=wrap.querySelector('input[type=hidden]');
  const input=document.getElementById(uid);
  hidden.value=val;
  const d=new Date(val+'T00:00:00');
  input.value=d.toLocaleDateString('en-ZA',{year:'numeric',month:'short',day:'numeric'});
  const dd=document.getElementById(uid+'_dd');if(dd)dd.classList.remove('open');
  input.dispatchEvent(new Event('change'));
}
function clearCal(uid){
  const wrap=document.getElementById(uid+'_wrap');
  if(!wrap)return;
  wrap.querySelector('input[type=hidden]').value='';
  document.getElementById(uid).value='';
  const dd=document.getElementById(uid+'_dd');if(dd)dd.classList.remove('open');
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.cal-wrap')){document.querySelectorAll('.cal-dropdown.open').forEach(d=>d.classList.remove('open'))}
});

// ====== KEYBOARD SHORTCUTS ======
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeModal();closeNotifPanel();}
  if(e.ctrlKey&&e.key==='u'){e.preventDefault();if(typeof openDMSUploadModal==='function')openDMSUploadModal();}
  if(e.ctrlKey&&e.key==='f'&&document.getElementById('dmsTabAdvanced')?.classList.contains('active')){e.preventDefault();const inp=document.getElementById('advSearchInput');if(inp)inp.focus();}
});

init();
</script>
